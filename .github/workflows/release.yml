name: Release Build & Artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: "Cross-Platform Release Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: core/go.sum

      - name: Run Release Guards (G-1, G-2, G-3)
        run: |
          bash ops/guards/sovereignty_boundary_guard.sh
          bash ops/guards/module_boundary_guard.sh
          bash ops/guards/no_duplicate_primitives.sh

      - name: Build Release Matrix & Checksums
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          bash scripts/build-release.sh "$TAG_NAME"

      - name: Create GitHub Release & Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
