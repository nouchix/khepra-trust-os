name: Release ktos-mint

on:
  push:
    tags:
      - 'v*' # Trigger on tags starting with v, e.g., v1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build macOS (ARM64)
        env:
          GOOS: darwin
          GOARCH: arm64
        run: go build -o bin/ktos-mint-darwin-arm64 core/cmd/ktos-mint/main.go

      - name: Build Linux (AMD64)
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -o bin/ktos-mint-linux-amd64 core/cmd/ktos-mint/main.go

      - name: Build Windows (AMD64)
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o bin/ktos-mint-windows-amd64.exe core/cmd/ktos-mint/main.go

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/ktos-mint-darwin-arm64
            bin/ktos-mint-linux-amd64
            bin/ktos-mint-windows-amd64.exe
          generate_release_notes: true
